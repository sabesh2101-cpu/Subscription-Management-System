{% extends 'base.html' %}

{% block title %}Page Not Found (404){% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
  <div class="col-md-7 col-lg-5 text-center">
    <div class="p-5 bg-white rounded-4 shadow-sm border">
      <div class="text-primary mb-3" style="font-size: 4rem;">
        <i class="bi bi-compass"></i>
      </div>
      <h2 class="fw-bold text-dark mb-2">404 - Page Not Found</h2>
      <p class="text-muted mb-4">
        The record or page you requested could not be found or has moved. Please verify the URL.
      </p>
      <div class="d-flex justify-content-center gap-2">
        <a href="{% url 'dashboard:index' %}" class="btn btn-primary px-4">
          <i class="bi bi-house me-1"></i> Return to Dashboard
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
