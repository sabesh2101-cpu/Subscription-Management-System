{% extends 'base.html' %}

{% block title %}Confirm Product Deletion{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
  <div class="col-md-6 col-lg-5">
    <div class="form-card text-center">
      <div class="text-danger mb-3" style="font-size: 3rem;">
        <i class="bi bi-exclamation-triangle"></i>
      </div>
      <h4 class="fw-bold text-dark mb-2">Delete Product?</h4>
      <p class="text-muted mb-4">
        Are you sure you want to delete <strong>{{ object.name }}</strong> (SKU: <code>{{ object.sku }}</code>)? This action cannot be undone.
      </p>

      <form method="post">
        {% csrf_token %}
        <div class="d-flex justify-content-center gap-2">
          <a href="{% url 'catalog:product_list' %}" class="btn btn-outline-secondary px-4">Cancel</a>
          <button type="submit" class="btn btn-danger px-4">
            <i class="bi bi-trash me-1"></i> Yes, Delete
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
